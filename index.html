<!DOCTYPE html>
<html class="html">
<head class="head">
    <meta class="meta" charset="UTF-8">
    <meta class="meta" name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="title">Simple Form</title>
    <link class="link" rel="stylesheet" href="style.css">
</head>
<body class="body">
    <h1 class="heading">Registration Form</h1>
    <form class="form" action="#" method="post">
        <label class="label" for="name">Name:</label>
        <input class="input" type="text" id="name" name="name" placeholder="Enter your name">

        <label class="label" for="email">Email:</label>
        <input class="input" type="email" id="email" name="email" placeholder="Enter your email">

        <label class="label" for="password">Password:</label>
        <input class="input" type="password" id="password" name="password" placeholder="Enter password">

        <label class="label" for="age">Age:</label>
        <input class="input" type="number" id="age" name="age" placeholder="Enter age">

        <label class="label" for="gender">Gender:</label>
        <select class="select" id="gender" name="gender">
            <option class="option" value="">Select</option>
            <option class="option" value="male">Male</option>
            <option class="option" value="female">Female</option>
            <option class="option" value="other">Other</option>
        </select>

        <input class="submit-button" type="submit" value="Submit">
    </form>
</body>
</html>
